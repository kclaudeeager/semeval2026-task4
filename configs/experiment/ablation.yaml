# @package _global_
# Every layer that can run without a HuggingFace download, swept over dev:
#   make ablation
# Add l2_e5, l3_characters, l4_roles and l5_combined to the list below once
# `uv pip install -e ".[embeddings,structure]"` has fetched the models.
defaults:
  - override /data: dev
  - override /eval: default

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      scorer: l0_random,l0_jaccard,l1_tfidf,l3n_characters_nocoref,l4n_roles_nocoref
