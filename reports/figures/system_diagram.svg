<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <style>
    .surface{fill:#fcfcfb}.ink{fill:#0b0b0b}.muted{fill:#52514e}
    .box{fill:#ffffff;stroke:#d8d7d2;stroke-width:1.5;rx:8}
    .cfg{fill:#eaf2fc;stroke:#2a78d6}.code{fill:#ffffff;stroke:#d8d7d2}
    .out{fill:#e8f7f1;stroke:#1baf7a}.arrow{stroke:#52514e;stroke-width:2;fill:none}
    .band{fill:none;stroke:#d8d7d2;stroke-width:1.5;stroke-dasharray:5 4;rx:12}
    .t{font-size:13px;font-weight:600}.s{font-size:11px}
    @media (prefers-color-scheme: dark){
      .surface{fill:#1a1a19}.ink{fill:#f0efec}.muted{fill:#c3c2b7}
      .box{fill:#252523;stroke:#3a3a38}.cfg{fill:#172740;stroke:#3987e5}
      .code{fill:#252523;stroke:#3a3a38}.out{fill:#12302a;stroke:#199e70}
      .arrow{stroke:#c3c2b7}.band{stroke:#3a3a38}
    }
  </style>
  <rect class="surface" width="980" height="560"/>
  <text class="ink t" x="24" y="30" font-size="15">How a run moves through the project</text>
  <text class="muted s" x="24" y="50">Settings on the left, code in the middle, evidence on the right. Nothing crosses back.</text>

  <rect class="band" x="18" y="68" width="236" height="300"/>
  <text class="muted s" x="30" y="88" font-weight="600">configs/ — what to do</text>
  <rect class="box cfg" x="34" y="100" width="200" height="40"/><text class="ink s" x="46" y="118">scorer/*.yaml</text><text class="muted s" x="46" y="132">which layer, which knobs</text>
  <rect class="box cfg" x="34" y="150" width="200" height="40"/><text class="ink s" x="46" y="168">data/*.yaml</text><text class="muted s" x="46" y="182">split to score, split to fit</text>
  <rect class="box cfg" x="34" y="200" width="200" height="40"/><text class="ink s" x="46" y="218">eval/*.yaml</text><text class="muted s" x="46" y="232">bootstrap, aspects, test lock</text>
  <rect class="box cfg" x="34" y="250" width="200" height="40"/><text class="ink s" x="46" y="268">experiment/*.yaml</text><text class="muted s" x="46" y="282">saved combinations</text>
  <text class="muted s" x="34" y="320">Adding a variant means</text><text class="muted s" x="34" y="336">one file here. No code</text><text class="muted s" x="34" y="352">anywhere else changes.</text>

  <path class="arrow" d="M254 220 H300" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker></defs>

  <rect class="band" x="300" y="68" width="356" height="400"/>
  <text class="muted s" x="312" y="88" font-weight="600">src/task4/ — how to do it</text>
  <rect class="box code" x="316" y="100" width="324" height="44"/><text class="ink s" x="330" y="120">cli.py</text><text class="muted s" x="330" y="135">assembles the config, refuses test unless unlocked</text>
  <path class="arrow" d="M478 144 V162" marker-end="url(#a)"/>
  <rect class="box code" x="316" y="166" width="156" height="44"/><text class="ink s" x="330" y="186">registry.py</text><text class="muted s" x="330" y="201">name → class</text>
  <rect class="box code" x="484" y="166" width="156" height="44"/><text class="ink s" x="498" y="186">dataset.py</text><text class="muted s" x="498" y="201">jsonl → Triple</text>
  <path class="arrow" d="M394 210 V232" marker-end="url(#a)"/><path class="arrow" d="M562 210 V232" marker-end="url(#a)"/>
  <rect class="box code" x="316" y="236" width="324" height="78"/>
  <text class="ink s" x="330" y="256">scorers/ — the layers</text>
  <text class="muted s" x="330" y="273">base.Scorer: score(anchor, candidate) → float</text>
  <text class="muted s" x="330" y="289">L0 lexical · L1 tfidf · L2 e5 · L3 characters</text>
  <text class="muted s" x="330" y="305">L4 roles (extends L3) · L5 combined (blends L2–L4)</text>
  <path class="arrow" d="M478 314 V336" marker-end="url(#a)"/>
  <rect class="box code" x="316" y="340" width="324" height="44"/><text class="ink s" x="330" y="360">evaluate.py</text><text class="muted s" x="330" y="375">scores every triple, slices by stratum</text>
  <rect class="box code" x="316" y="398" width="156" height="44"/><text class="ink s" x="330" y="418">stats.py</text><text class="muted s" x="330" y="433">Wilson · bootstrap · McNemar</text>
  <rect class="box code" x="484" y="398" width="156" height="44"/><text class="ink s" x="498" y="418">strata.py</text><text class="muted s" x="498" y="433">unanimous vs split</text>
  <path class="arrow" d="M394 384 V396" marker-end="url(#a)"/><path class="arrow" d="M562 384 V396" marker-end="url(#a)"/>

  <path class="arrow" d="M656 362 H706" marker-end="url(#a)"/>

  <rect class="band" x="706" y="68" width="256" height="400"/>
  <text class="muted s" x="718" y="88" font-weight="600">outputs — the evidence</text>
  <rect class="box out" x="722" y="100" width="222" height="84"/>
  <text class="ink s" x="736" y="120">data/raw/</text><text class="muted s" x="736" y="136">the release, untouched</text>
  <text class="ink s" x="736" y="158">data/interim/</text><text class="muted s" x="736" y="174">coref and embedding caches</text>
  <rect class="box out" x="722" y="330" width="222" height="76"/>
  <text class="ink s" x="736" y="350">reports/results/*.json</text>
  <text class="muted s" x="736" y="366">accuracy, intervals, strata,</text>
  <text class="muted s" x="736" y="381">config, git sha, per-item hits</text>
  <path class="arrow" d="M833 406 V432" marker-end="url(#a)"/>
  <rect class="box out" x="722" y="436" width="222" height="44"/>
  <text class="ink s" x="736" y="456">plots.py → figures/</text><text class="muted s" x="736" y="471">charts for the report and talk</text>
  <path class="arrow" d="M722 142 H668 V190 H640" marker-end="url(#a)"/>

  <text class="muted s" x="24" y="508">The per-item hit vector saved in each result is what lets McNemar compare two layers weeks later,</text>
  <text class="muted s" x="24" y="526">without rerunning either of them. That is why results are tracked in git and run folders are not.</text>
  <text class="muted s" x="24" y="544">tests/ guards the three pieces that are easy to get quietly wrong: stats.py, strata.py, evaluate.py.</text>
</svg>
