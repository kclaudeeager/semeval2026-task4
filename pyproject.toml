[project]
name = "task4"
version = "0.1.0"
description = "SemEval-2026 Task 4 Track A: layered ablation for narrative story similarity"
requires-python = ">=3.10"
dependencies = [
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
# The embeddings stack splits by platform, because PyTorch stopped shipping
# macOS x86_64 wheels after 2.2.2 (2.3.0 onward is arm64 only).
#
#   Intel macOS : torch is capped at 2.2.2, which caps transformers at 4.x
#                 (5.x silently disables a torch below 2.6) and numpy at 1.x
#                 (2.2.2 was compiled against the NumPy 1 ABI).
#   Everywhere  : current torch, current transformers.
#
# sentence-transformers <6 is what allows transformers 4.x; >=6 requires 5.x.
embeddings = [
  # --- macOS on Intel ---
  "torch==2.2.2;                sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "transformers>=4.41,<5;       sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sentence-transformers>=3,<6; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "numpy<2;                     sys_platform == 'darwin' and platform_machine == 'x86_64'",
  # --- Apple Silicon, Linux, Windows ---
  "torch>=2.6;                  sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "sentence-transformers>=6;    sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
# spacy>=3.8 is the first release built against NumPy 2.
structure  = ["maverick-coref>=1.0", "spacy>=3.8"]
viz        = ["matplotlib>=3.8"]
dev        = ["pytest>=8.0", "ruff>=0.5", "matplotlib>=3.8", "jupyterlab>=4.0", "nbformat>=5.9"]

[project.scripts]
task4 = "task4.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
