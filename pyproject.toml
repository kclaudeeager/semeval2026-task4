[project]
name = "task4"
version = "0.1.0"
description = "SemEval-2026 Task 4 Track A: layered ablation for narrative story similarity"
requires-python = ">=3.10"
dependencies = [
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0", "torch>=2.2"]
structure  = ["maverick-coref>=1.0", "spacy>=3.7"]
dev        = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
task4 = "task4.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
